<!doctype html><html lang="en"><head><meta charset="utf-8"><title>shelf direction B5</title><link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Sans:wght@400;600&display=block" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;padding:28px;background:#cfc9c0;font-family:system-ui}
