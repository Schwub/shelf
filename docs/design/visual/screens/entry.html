.rate .rk:nth-child(4).on .rbar{background:var(--m4)}.rate .rk:nth-child(5).on .rbar{background:var(--m5)}
.rate .rk:nth-child(1).half .rbar{background:linear-gradient(90deg,var(--m1) 50%,var(--off) 50%)}.rate .rk:nth-child(2).half .rbar{background:linear-gradient(90deg,var(--m2) 50%,var(--off) 50%)}

.rate .rk:nth-child(5).half .rbar{background:linear-gradient(90deg,var(--m5) 50%,var(--off) 50%)}
/* Light window fixed at the start of every key: 10 px from the face's left edge, on its vertical centre; moves with the face. */
.key:has(.led),.tab:has(.led){padding-left:28px!important;padding-right:21px!important}
.key.on:has(.led),.tab.on:has(.led){padding-left:31px!important;padding-right:18px!important}
.key .led,.tab .led{position:absolute;left:10px;top:16px;margin:0}
.key.on .led,.tab.on .led{left:13px;top:19.6px}
.row5 .tab:has(.led){padding-left:24px!important;padding-right:7px!important}
.row5 .tab.on:has(.led){padding-left:27px!important;padding-right:4px!important}

/* tag groups on the album entry: keys wrap and grow to fill each row */
.tagkeys{display:flex;flex-wrap:wrap;gap:8px}.tagkeys .key{flex:0 0 auto}
.subgroup{margin:8px 0 0 12px;padding-left:12px;box-shadow:inset 2px 0 0 var(--line)}
.subgroup .lbl{margin-top:4px}
.stage{flex:none}.panel{min-height:0;overflow:hidden}
.lbl a{font:600 13px 'IBM Plex Sans';color:var(--muted);text-decoration:underline;text-underline-offset:3px;display:inline-flex;align-items:center;gap:4px;height:44px;margin:-14px 0 -14px;padding-left:12px}
.lbl a svg{width:14px;height:14px}
.tagkeys.fit .key{flex:1 1 0;min-width:0}
.none{font-size:13px;color:var(--muted);height:20px}
.textlink{display:inline-flex;align-items:center;height:44px;font:600 13px 'IBM Plex Sans';color:var(--muted);text-decoration:underline;text-underline-offset:3px}
/* screen bar for editor screens */
.scrbar{display:flex;align-items:center;gap:12px;padding:8px 20px 12px}.scrbar h2{font:700 24px Archivo,sans-serif;font-stretch:125%;margin:0;flex:1}
.scroll{flex:1;overflow:hidden;padding:0 20px 112px}
/* list rows */
.lrow{display:flex;align-items:center;gap:8px;min-height:56px;box-shadow:inset 0 -1px 0 var(--line)}
.lrow .grow{flex:1;min-width:0}.lrow .t{font:600 15px 'IBM Plex Sans'}.lrow .s{font-size:12px;color:var(--muted);margin-top:2px}
.lrow .ic{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.lrow .ic.hd{margin-left:-12px}.lrow .ic.end{margin-right:-12px}
.lrow.dim .t,.lrow.dim .s{opacity:.55}
.mark{font:600 12px 'IBM Plex Sans';color:var(--muted);flex:none}
.lrow .led{flex:none}.lrow .led.on{background:var(--signal);box-shadow:none}
.lrow.add .t{display:flex;align-items:center;gap:8px}
.sect{font:600 12px 'IBM Plex Sans';color:var(--muted);margin:20px 0 4px}
.err{display:flex;gap:6px;align-items:flex-start;font:600 12px 'IBM Plex Sans';color:var(--text);margin:8px 0 0}.err svg{color:var(--signal);flex:none}
.hint{font-size:12px;color:var(--muted);margin:16px 0 0;line-height:1.45}
.two{display:flex;gap:8px}.two .key{flex:1}
/* bottom sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:76%;background:var(--bg);border-radius:4px 4px 0 0;box-shadow:inset 0 1px 0 var(--line),0 -16px 40px -12px #0009;padding:8px 20px 28px;z-index:6;overflow:hidden}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--off);margin:0 auto 16px}
.sheet h3{font:700 18px Archivo,sans-serif;font-stretch:115%;margin:0 0 4px}.sheet .sub{font-size:13px;color:var(--muted);margin:0 0 8px}
.sheet .foot{display:flex;gap:8px;margin-top:16px}.sheet .foot .key{flex:1}
.dimmer{position:absolute;inset:0;background:#00000073;z-index:5}
/* dropdown menu */
.dmenu{position:absolute;right:20px;top:92px;width:200px;background:var(--surface);border-radius:4px;box-shadow:inset 0 0 0 1px var(--line),0 16px 32px -10px #000a;z-index:6;padding:4px 0}
.dmenu div{height:48px;display:flex;align-items:center;padding:0 16px;font:600 14px 'IBM Plex Sans'}
/* filter bar preview with scrolling */
.fprev{display:flex;gap:6px;margin-right:-20px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 32px),#0000);mask-image:linear-gradient(90deg,#000 calc(100% - 32px),#0000)}
.fprev .col{flex:none;width:calc((350px - 24px)/5)}
.fprev .col .l{text-align:center;font:600 12px Archivo,sans-serif;font-stretch:112%;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px;padding-right:5px}
.fprev .tab{width:100%;height:44px;font:600 13px Archivo,sans-serif;font-stretch:112%;display:flex;align-items:center;justify-content:center;padding-left:24px!important;padding-right:7px!important}
.fprev .tab.on{padding-left:27px!important;padding-right:4px!important}
/* review fixes */
.fprev{padding-bottom:12px}
.lrow .led{box-shadow:inset 0 1px 2px #0006,inset 0 0 0 1px var(--off)}
.lrow.dim .t,.lrow.dim .s{opacity:1;color:var(--muted)}
.lrow .s{margin-top:4px}
.err{gap:8px}
.lbl a svg{width:16px;height:16px}
.dmenu{top:88px}.dmenu div{font:600 15px 'IBM Plex Sans'}
.center h3{font-size:18px}
.searchfield{font-size:14px}
.note b{font-weight:600}
.note .lrow svg{color:var(--muted)}
.scrim{background:#00000073}
.slot{width:10px;flex:none;display:flex;justify-content:center;overflow:visible}
.from{font-size:12px;color:var(--muted);margin-top:4px}
.textlink{display:flex;width:max-content;margin:12px 0 -4px}
