.phone{width:390px;height:844px;border-radius:30px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 0 0 2px #333;
 font-family:'IBM Plex Sans',sans-serif;color:var(--text);background:var(--bg)}
.sb{height:28px;font:12px system-ui;padding:8px 24px;opacity:.7;position:relative;z-index:2}

.head{padding:12px 20px 0;display:flex;justify-content:space-between;align-items:baseline}
.head h2{font-size:24px;font-weight:700;line-height:1;margin:0;letter-spacing:-.01em}
.head .count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
/* the one control: the key */
.key{height:44px;padding:0 16px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:4px;background:var(--surface);color:var(--text);
 font:600 13px Archivo,sans-serif;font-stretch:112%;white-space:nowrap;box-shadow:inset 0 0 0 1px var(--line)}
.led{width:8px;height:8px;border-radius:1px;box-shadow:inset 0 0 0 1px var(--off);flex:none}
.key.on{background:var(--surfaceOn);box-shadow:inset 0 0 0 1.5px var(--signal)}.key.on .led,.led.on{background:var(--signal);box-shadow:none}
.key.primary{background:var(--amber);color:var(--onAmber);box-shadow:none}
.keys{display:flex;gap:8px}.keys .key{flex:1}
/* divider tabs: keys standing on a teak line */
.tabs{display:flex;padding:16px 0 0 20px;overflow:hidden;position:relative}
.tabrow{display:flex;gap:4px;align-items:flex-end;flex:1;min-width:0;padding-top:4px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 32px),#0000);mask-image:linear-gradient(90deg,#000 calc(100% - 32px),#0000)}
.tabs:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--teak);box-shadow:inset 0 1px 0 #ffffff33}
.tab{flex:none;height:44px;padding:0 12px 4px;margin-bottom:-8px;display:flex;align-items:center;gap:8px;border-radius:4px;background:var(--surface);

.board{height:4px;background:var(--teak);margin:0 -20px;position:relative;box-shadow:inset 0 1px 0 #ffffff33}

.state{display:flex;align-items:center;gap:8px;margin-top:4px;font:600 12px 'IBM Plex Sans';color:var(--signal);height:12px}
.bar{position:absolute;left:0;right:0;bottom:0;padding:12px 20px 28px;background:var(--bg);box-shadow:0 -1px 0 var(--line);display:flex;gap:8px}
.key.ic{width:44px;padding:0}.key.ic svg{width:20px;height:20px}.bar .primary{flex:1}.key svg{flex:none}

.sp.sel{transform:translateY(-8px)}.sp.sel:after{content:"";position:absolute;left:50%;bottom:-16px;margin-left:-4px;width:8px;height:8px;border-radius:1px;background:var(--signal)}
.pulled{margin:24px 20px 0;display:flex;gap:12px;align-items:center}.pulled .cv{width:64px;flex:none}

.stage .board{position:absolute;left:0;right:0;top:276px;margin:0}

.actions{position:absolute;left:0;right:0;bottom:0;padding:12px 20px 28px;display:flex;gap:8px;box-shadow:0 -1px 0 var(--line);background:var(--bg)}.actions .key{flex:1}
