<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>shelf wireframe: Album entry</title><style>
*{box-sizing:border-box}
body{margin:0;padding:24px;background:#e9e9e9;font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#222}
h1{font-size:20px;margin:0 0 4px}
p.intro{margin:0 0 20px;color:#555;max-width:900px}
nav.files{margin:0 0 20px}nav.files a{margin-right:14px;color:#222}
.row{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
figure{margin:0}
figcaption{font-weight:600;margin:0 0 8px;font-size:14px}
.phone{width:390px;height:844px;background:#fff;border:2px solid #555;border-radius:28px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.status{height:28px;font-size:12px;color:#777;padding:6px 20px}
.bar{height:56px;display:flex;align-items:center;gap:4px;padding:0 4px;border-bottom:1px solid #ddd}
.bar .title{flex:1;font-size:20px;padding-left:12px}
.icon{width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#444;border-radius:24px}
.body{flex:1;overflow:hidden;padding:16px;position:relative}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:100%;gap:12px;color:#444}
label{display:block;font-size:13px;color:#444;margin:0 0 4px}
.field{height:56px;border:1px solid #888;border-radius:4px;padding:16px 12px;color:#222;background:#fff}
.field.placeholder{color:#888}.field.error{border:2px solid #222}
.field.multi{height:96px}
.help{font-size:13px;color:#555;margin:4px 0 16px}.help.error{color:#111;font-weight:600}
.btn{height:48px;min-width:64px;border-radius:24px;display:inline-flex;align-items:center;justify-content:center;padding:0 24px;font-weight:600;border:1px solid #777;background:#fff;color:#222}
.btn.primary{background:#444;color:#fff;border-color:#444}
.btn.disabled{background:#ddd;color:#999;border-color:#ddd}
.btn.text{border:none;padding:0 12px}
.btn.block{display:flex;width:100%}
.chips{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.chip{height:32px;padding:0 14px;border:1px solid #888;border-radius:8px;display:flex;align-items:center;font-size:14px}
.chip.on{background:#ccc;border-color:#ccc;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile .cover{aspect-ratio:1;background:#bbb;border-radius:4px;position:relative}
.tile .t{font-size:13px;font-weight:600;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .a{font-size:12px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{position:absolute;left:4px;bottom:4px;background:#fff;border:1px solid #777;border-radius:4px;font-size:11px;padding:1px 5px}
.skel{background:#e3e3e3!important}
.skel-line{height:10px;background:#e3e3e3;border-radius:4px;margin-top:6px}
.list .item{display:flex;gap:12px;align-items:center;min-height:72px;border-bottom:1px solid #eee;padding:8px 0}
.list .cover{width:56px;height:56px;background:#bbb;border-radius:4px;flex:none}
.list .meta{flex:1;min-width:0}
.list .t{font-weight:600}.list .a{font-size:13px;color:#555}
.list .side{font-size:12px;color:#444;text-align:right}
.fab{position:absolute;right:16px;bottom:16px;height:56px;border-radius:16px;background:#444;color:#fff;display:flex;align-items:center;gap:8px;padding:0 20px;font-weight:600}
.snack{position:absolute;left:12px;right:12px;bottom:84px;background:#333;color:#fff;border-radius:4px;min-height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px;font-size:14px}
.snack b{color:#fff;padding:12px}
.seg{display:flex;border:1px solid #777;border-radius:24px;overflow:hidden;height:48px}
.seg div{flex:1;display:flex;align-items:center;justify-content:center;border-right:1px solid #777;font-weight:600}
.seg div:last-child{border-right:none}.seg .on{background:#ccc}
.stars{display:flex;align-items:center}
.star{width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:30px;color:#444}.star.off{color:#ccc}.star.half span{background:linear-gradient(90deg,#444 50%,#ccc 50%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tile .r{font-size:12px;color:#444}
.album{display:flex;gap:16px;margin:0 0 20px}
.album .cover{width:120px;height:120px;background:#bbb;border-radius:4px;flex:none}
.album .t{font-size:20px;font-weight:600}.album .a{color:#444}.album .y{color:#666;font-size:13px}
.section{font-size:13px;font-weight:600;color:#444;margin:16px 0 8px}
.note{background:#eee;border-radius:8px;padding:12px;font-size:14px;margin:0 0 16px}
.bottom{padding:12px 16px 20px;border-top:1px solid #ddd;display:flex;gap:12px;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:24px}
.dialog{background:#fff;border-radius:24px;padding:24px;width:100%}
.dialog h2{font-size:20px;margin:0 0 12px;font-weight:500}
.dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.menu{position:absolute;right:8px;top:88px;background:#fff;border:1px solid #999;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.2);width:180px}
.menu div{height:48px;display:flex;align-items:center;padding:0 16px}
.spinner{width:40px;height:40px;border:4px solid #ccc;border-top-color:#444;border-radius:50%}
.progress{height:4px;background:#ccc;margin:-16px -16px 16px}
.small{font-size:13px;color:#555}
