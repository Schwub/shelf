name: staging-test-friend

# By hand: gives one account a test friend (supabase/dev/test_friend.sql),
# with albums and feed activity, on staging.
on:
  workflow_dispatch:
    inputs:
      email:
        description: Email of the staging account (it must have signed in once)
        required: true

permissions:
  contents: read

jobs:
  add:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
      PROJECT: ${{ vars.SUPABASE_STAGING_PROJECT_ID }}
      EMAIL: ${{ inputs.email }}
      MISE_EXEC_AUTO_INSTALL: false
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install_args: supabase
      - run: mise exec -- supabase link --project-ref="$PROJECT"
      - run: mise exec -- supabase/dev/test-data.sh friend "$EMAIL" --remote
