name: db

# Branches run through their pull request, so only main runs on push (and
# then deploys to staging).
on:
  push:
    branches: [main]
    paths: [supabase/**, mise.toml, .github/workflows/db.yml]
  pull_request:
    paths: [supabase/**, mise.toml, .github/workflows/db.yml]

# A newer push to a pull request replaces the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-db:
    runs-on: ubuntu-latest
    env:
      # Only the Supabase CLI and Deno are needed; skip installing Flutter.
      MISE_TASK_RUN_AUTO_INSTALL: false
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install_args: supabase deno
      - run: mise run test:db
      - run: mise run test:functions
