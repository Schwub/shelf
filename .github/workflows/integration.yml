name: integration

# The app's Supabase repositories against a local Supabase: what the unit
# tests' in-memory fake can't check (queries, database errors, triggers).
# Only when the data code, the database or these tests change.
on:
  push:
    branches: [main]
    paths:
      - app/lib/shelf/shelf.dart
      - app/lib/**/supabase_*_repository.dart
      - app/test_integration/**
      - supabase/migrations/**
      - mise.toml
      - .github/workflows/integration.yml
  pull_request:
    paths:
      - app/lib/shelf/shelf.dart
      - app/lib/**/supabase_*_repository.dart
      - app/test_integration/**
      - supabase/migrations/**
      - mise.toml
      - .github/workflows/integration.yml

# A newer push to a pull request replaces the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      MISE_TASK_RUN_AUTO_INSTALL: false
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install_args: flutter supabase
      - run: mise run test:integration
