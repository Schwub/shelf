name: web

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request replaces the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  # Secrets are missing until Cloudflare is set up, and on PRs from forks;
  # a job-level `if` can't read them directly.
  configured:
    runs-on: ubuntu-latest
    outputs:
      yes: ${{ steps.check.outputs.yes }}
    steps:
      - id: check
        run: echo "yes=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: configured
    if: needs.configured.outputs.yes == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Uploads source maps to Sentry; missing on PRs from forks.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      # Only Flutter is needed; don't install the other mise tools.
      MISE_EXEC_AUTO_INSTALL: false
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install_args: flutter
      # The hosted Supabase project: repository variables, not secrets (the
      # publishable key ships in the app anyway).
      - env:
          MUSICBRAINZ_CONTACT: ${{ vars.MUSICBRAINZ_CONTACT }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          # Pull request previews report apart from main.
          SENTRY_ENVIRONMENT: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
        run: >-
          mise exec -- flutter build web --release --source-maps
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          --dart-define=MUSICBRAINZ_CONTACT="$MUSICBRAINZ_CONTACT"
          --dart-define=SENTRY_DSN="$SENTRY_DSN"
          --dart-define=SENTRY_ENVIRONMENT="$SENTRY_ENVIRONMENT"
        working-directory: app
      # Settings in pubspec.yaml (`sentry:`). The maps stay out of the
      # deploy: Sentry has them, browsers don't need them.
      - if: env.SENTRY_AUTH_TOKEN != ''
        run: mise exec -- dart run sentry_dart_plugin
        working-directory: app
      - run: find app/build/web -name '*.map' -delete
      - id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          # main deploys to production; any other branch gets a preview alias.
          command: pages deploy app/build/web --project-name=shelf --branch=${{ github.head_ref || github.ref_name }}
      - if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- web-preview -->';
            const body = `${marker}\nWeb preview: ${process.env.URL}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find(c => c.body.startsWith(marker));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
