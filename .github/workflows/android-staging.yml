name: android-staging

# Builds the Android app against staging Supabase on every push to main and
# publishes it as a GitHub release, which Obtainium installs on the phone.
on:
  push:
    branches: [main]
    paths: [app/**, mise.toml, .github/workflows/android-staging.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency: android-staging

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      MISE_EXEC_AUTO_INSTALL: false
      # Obtainium compares the release tag with the installed version.
      VERSION: 1.0.${{ github.run_number }}
      SUPABASE_URL: https://${{ vars.SUPABASE_STAGING_PROJECT_ID }}.supabase.co
      SUPABASE_KEY: ${{ vars.SUPABASE_STAGING_PUBLISHABLE_KEY }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Set the repository variable SUPABASE_STAGING_PUBLISHABLE_KEY (Supabase → Project Settings → API Keys)."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: jdx/mise-action@v3
        with:
          install_args: flutter
      - run: >-
          mise exec -- flutter build apk --release
          --build-name="$VERSION" --build-number=${{ github.run_number }}
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_KEY"
        working-directory: app
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk "shelf-staging-$VERSION.apk"
          gh release create "v$VERSION" "shelf-staging-$VERSION.apk" \
            --title "Staging $VERSION" \
            --notes "Staging build of $(git log -1 --format='%h: %s')" \
            --target "$GITHUB_SHA"
