name: android

# Only when something that can break the native build changes: the Android
# project, plugins (pubspec) or the toolchain. Dart-only changes are covered
# by check; on main, android-staging builds the release APK.
on:
  pull_request:
    paths:
      - app/android/**
      - app/pubspec.yaml
      - app/pubspec.lock
      - mise.toml
      - .github/workflows/android.yml
  workflow_dispatch:

# A newer push to a pull request replaces the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      # Only Flutter is needed; don't install the other mise tools.
      MISE_EXEC_AUTO_INSTALL: false
    steps:
      # Two APK builds with the NDK and Gradle caches fill the runner's disk
      # ("No space left on device"); remove preinstalled tools shelf doesn't use.
      - name: Free disk space
        run: >-
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          # Gradle's downloads, so a build doesn't fetch them all again (Maven
          # Central answered one with 429 Too Many Requests, 2026-11-26).
          cache: gradle
      - uses: jdx/mise-action@v3
        with:
          install_args: flutter
      - run: mise exec -- flutter build apk --debug
        working-directory: app
      # Also checks the release signing that staging builds use.
      - run: mise exec -- flutter build apk --release
        working-directory: app
