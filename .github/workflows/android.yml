name: android

on:
  push:
    paths: [app/**, mise.toml, .github/workflows/android.yml]
  pull_request:
    paths: [app/**, mise.toml, .github/workflows/android.yml]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      # Only Flutter is needed; don't install the other mise tools.
      MISE_EXEC_AUTO_INSTALL: false
    steps:
      # Two APK builds with the NDK and Gradle caches fill the runner's disk
      # ("No space left on device"); remove preinstalled tools shelf doesn't use.
      - name: Free disk space
        run: >-
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: jdx/mise-action@v3
        with:
          install_args: flutter
      - run: mise exec -- flutter build apk --debug
        working-directory: app
      # Also checks the release signing that staging builds use.
      - run: mise exec -- flutter build apk --release
        working-directory: app
