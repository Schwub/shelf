[tools]
flutter = "3.50.1"
supabase = "3.2.0"
deno = "2.9.8"
node = "24"
"npm:backlog.md" = "1.55.3"

[tasks.agent]
description = "Run Claude Code in a Docker sandbox on a private clone of this repo"
run = "sbx run --clone claude ."

[tasks."agentic:update"]
description = "Update the files shared with the blueprint (see .agents/managed.txt)"
run = ".agents/update.sh"

[tasks.check]
description = "Run all checks (every check:* task)"
depends = ["check:*"]

[tasks."check:guard"]
description = "Test the command guard"
run = ".agents/guard.test.sh"


[tasks."check:format"]
description = "Check Dart formatting (fix with: dart format .)"
dir = "app"
run = "dart format --output=none --set-exit-if-changed ."

[tasks."check:analyze"]
description = "Analyze the Flutter app"
dir = "app"
run = "flutter analyze"

[tasks."check:test"]
description = "Run the Flutter tests"
dir = "app"
run = "flutter test"

[tasks."test:db"]
description = "Run the database tests in supabase/tests (needs Docker)"
run = "supabase db start && supabase db reset && supabase test db"

[tasks."test:integration"]
description = "Run the app's Supabase repository against a local Supabase (needs Docker)"
run = """
supabase start -x studio,imgproxy,mailpit,realtime,logflare,vector,supavisor,edge-runtime,storage-api,postgres-meta
supabase db reset
eval "$(supabase status -o env | grep -E '^(API_URL|SERVICE_ROLE_KEY|PUBLISHABLE_KEY)=')"
export API_URL SERVICE_ROLE_KEY PUBLISHABLE_KEY
cd app && flutter test test_integration
"""

[tasks."check:build"]
description = "Build the web app (iOS and Android need local SDKs)"
dir = "app"
run = "flutter build web"

[tasks."dev:albums"]
description = "Add test albums to an account's shelf in the local Supabase (usage: mise run dev:albums -- <email>)"
run = "supabase/dev/test-albums.sh"

[tasks."test:functions"]
description = "Test, lint and type-check the edge functions in supabase/functions"
run = [
  "deno fmt --check supabase/functions",
  "deno lint supabase/functions",
  "deno check supabase/functions/*/index.ts",
  "deno test supabase/functions",
]
