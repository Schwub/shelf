<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <!-- The launcher icon (candidate A, docs/design/visual/variations/launcher-icon.html):
       three covers standing on a teak board against the wall. 108 x 108 is
       Android's adaptive icon; the group "art" is the foreground, everything
       important inside the middle 72 x 72. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E2019"/><stop offset="1" stop-color="#1F1510"/></linearGradient>
    <linearGradient id="teak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C08A5B"/><stop offset="1" stop-color="#8E5C38"/></linearGradient>
    <radialGradient id="sun" cx="0.3" cy="0.3" r="0.9"><stop offset="0" stop-color="#FFD84A"/><stop offset="0.45" stop-color="#F2732C"/><stop offset="1" stop-color="#3A1660"/></radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B6F8F"/><stop offset="0.55" stop-color="#7FC3C9"/><stop offset="1" stop-color="#E8D7B8"/></linearGradient>
    <linearGradient id="split" x1="0" y1="0" x2="1" y2="1"><stop offset="0.42" stop-color="#E9E4DC"/><stop offset="0.42" stop-color="#D23A2C"/><stop offset="0.5" stop-color="#D23A2C"/><stop offset="0.5" stop-color="#2B3A55"/></linearGradient>
  </defs>
  <rect id="wall" width="108" height="108" fill="url(#wall)"/>
  <g id="art" transform="translate(54 54) scale(0.92) translate(-54 -54)">
    <rect x="22" y="40" width="20" height="20" rx="1" fill="url(#sun)"/>
    <rect x="44" y="34" width="26" height="26" rx="1" fill="url(#sky)"/>
    <rect x="72" y="42" width="18" height="18" rx="1" fill="url(#split)"/>
    <rect x="16" y="60" width="76" height="5" fill="url(#teak)"/>
    <rect x="16" y="65" width="76" height="6" fill="#000" opacity=".28"/>
  </g>
</svg>
